; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c6]
; Tested Seeed platform revision, with Arduino ESP32 core 3.3.7.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#024c190fef52da02ebae5c09d47c101e0ff0762a
board = seeed-xiao-esp32-c6
framework = arduino
monitor_speed = 115200

; Match the vendor's esptool 5 CLI instead of reusing an old cached esptool 4.
platform_packages =
    tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.1.2/esptool.zip
